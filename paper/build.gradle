plugins {
    id 'java'
}

group = 'org.ssoggy'
version = '4.5.5'

// Dedicated configuration for libs to bundle into the fat JAR.
configurations {
    bundled
}

dependencies {
    // Inject the common module
    implementation project(':common')

    // Paper API (provided by server at runtime)
    compileOnly 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT'

    // Database dependencies — in 'bundled' so they can be merged into
    // the fat JAR without resolving runtimeClasspath during configuration.
    bundled 'com.zaxxer:HikariCP:7.0.2'
    bundled 'com.mysql:mysql-connector-j:8.0.33'
    bundled 'org.xerial:sqlite-jdbc:3.45.3.0'

    // Testing
    testImplementation 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.14.4'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.14.4'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.14.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.23.0'
}

test {
    useJUnitPlatform()
}

// Bundle everything into a fat JAR for plug-and-play
jar {
    from(project(':common').sourceSets.main.output)

    // Use the isolated 'bundled' config — never touches runtimeClasspath.
    from {
        configurations.bundled.collect { it.isDirectory() ? it : zipTree(it) }
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

processResources {
    def props = [version: project.version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props + [project: project]
    }
}
