version: 2
updates:
  # 1. Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  # 2. Keep Gradle dependencies (Minecraft APIs, Libs) up to date
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    # IMPORTANT: This tells Dependabot to also check your gradlew / wrapper properties
    # so you don't get stuck on old versions manually.
    commit-message:
      prefix: "deps"

    # Grouping is smart to prevent PR spam
    groups:
      minecraft-dependencies:
        patterns:
          - "com.terraformersmc*"
          - "net.fabricmc*"
          - "io.papermc*"
          - "org.spigotmc*"
      database-dependencies:
        patterns:
          - "org.xerial*"
          - "com.mysql*"
          - "com.zaxxer*"

    # PROTECTION: Avoid the "Gradle 8.11 + Loom" disaster
    # You might want to ignore major Gradle updates until you know Loom is ready
    ignore:
      - dependency-name: "org.gradle:gradle"
        update-types: ["version-update:semver-major"]
