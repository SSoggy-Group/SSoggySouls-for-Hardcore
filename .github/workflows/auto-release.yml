name: Auto Bump, Build, and Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'pom.xml'
      - '**/gradle.properties'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Force Bump Type (Ignored if Manual Version is set)"
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      manual_version:
        description: "Manual Version (e.g., 4.1.0). Leave blank to use Bump Type/Commit logic."
        required: false
        type: string

permissions:
  contents: write

jobs:
  bump-and-release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # --- VERSION BUMPING LOGIC ---
      - name: Calculate Next Version
        id: version_math
        run: |
          OLD_VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$OLD_VERSION"
          
          BUMP_TYPE="${{ inputs.bump_type }}"
          MANUAL_VERSION="${{ inputs.manual_version }}"
          SKIP_RELEASE="false"
          
          if [[ "${{ github.event_name }}" == "push" ]]; then
            COMMIT_MSG=$(git log -1 --pretty=%B)
            if [[ "$COMMIT_MSG" == *"docs:"* ]] || [[ "$COMMIT_MSG" == *"ci:"* ]] || [[ "$COMMIT_MSG" == *"test:"* ]]; then
              echo "Housekeeping commit detected. Skipping release."
              SKIP_RELEASE="true"
            elif [[ "$COMMIT_MSG" == *"BREAKING"* ]] || [[ "$COMMIT_MSG" == *"[major]"* ]]; then
              BUMP_TYPE="major"
            elif [[ "$COMMIT_MSG" == *"feat:"* ]] || [[ "$COMMIT_MSG" == *"[minor]"* ]]; then
              BUMP_TYPE="minor"
            else
              BUMP_TYPE="patch"
            fi
          fi
          
          echo "skip=$SKIP_RELEASE" >> $GITHUB_OUTPUT
          
          if [ "$SKIP_RELEASE" == "false" ]; then
            # If a manual version is provided, use it. Otherwise, calculate the bump.
            if [[ -n "$MANUAL_VERSION" ]]; then
              NEW_VERSION="$MANUAL_VERSION"
            else
              if [ "$BUMP_TYPE" == "major" ]; then
                NEW_VERSION="$((MAJOR + 1)).0.0"
              elif [ "$BUMP_TYPE" == "minor" ]; then
                NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
              else
                NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
              fi
            fi
            
            echo "OLD_VERSION=$OLD_VERSION" >> $GITHUB_ENV
            echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          fi

      # --- APPLY AND COMMIT ---
      - name: Apply Version to POM and Gradle files
        if: steps.version_math.outputs.skip != 'true'
        run: |
          mvn versions:set -DnewVersion=${NEW_VERSION} -DgenerateBackupPoms=false
          sed -i "s/$OLD_VERSION/$NEW_VERSION/g" fabric/gradle.properties || true
          sed -i "s/$OLD_VERSION/$NEW_VERSION/g" forge/gradle.properties || true

      - name: Auto-Update Docs References
        if: steps.version_math.outputs.skip != 'true'
        run: |
          find . -type f -name "*.md" -print0 | xargs -0 sed -i "s/$OLD_VERSION/$NEW_VERSION/g"

      - name: Commit version bump to Repository
        if: steps.version_math.outputs.skip != 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A || true
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(release): bump version to v${NEW_VERSION} [skip ci]"
            git tag "v${NEW_VERSION}"
            git push origin main
            git push origin "v${NEW_VERSION}"
          fi

      # --- BUILDING JARS ---
      - name: Build Root Plugin (Maven)
        if: steps.version_math.outputs.skip != 'true'
        run: mvn -B clean package

      - name: Build Fabric Mod
        if: steps.version_math.outputs.skip != 'true'
        run: |
          chmod +x ./fabric/gradlew
          ./fabric/gradlew -p fabric build

      - name: Build Forge Mod
        if: steps.version_math.outputs.skip != 'true'
        run: |
          chmod +x ./forge/gradlew
          ./forge/gradlew -p forge build

      # --- PACKAGING AND RELEASING ---
      - name: Locate and Rename Jars
        if: steps.version_math.outputs.skip != 'true'
        id: package
        run: |
          RAW_PAPER="$(ls target/*-shaded.jar | head -n 1)"
          RAW_FABRIC="$(ls fabric/build/libs/*.jar | grep -v sources | head -n 1)"
          RAW_FORGE="$(ls forge/build/libs/*.jar | grep -v sources | head -n 1)"
          
          FINAL_PAPER="SSoggySouls-Paper-${NEW_VERSION}.jar"
          FINAL_FABRIC="SSoggySouls-Fabric-${NEW_VERSION}.jar"
          FINAL_FORGE="SSoggySouls-Forge-${NEW_VERSION}.jar"
          
          mv "$RAW_PAPER" "$FINAL_PAPER"
          mv "$RAW_FABRIC" "$FINAL_FABRIC"
          mv "$RAW_FORGE" "$FINAL_FORGE"
          
          echo "jar=$FINAL_PAPER" >> "${GITHUB_OUTPUT}"
          echo "fabric_jar=$FINAL_FABRIC" >> "${GITHUB_OUTPUT}"
          echo "forge_jar=$FINAL_FORGE" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        if: steps.version_math.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.NEW_VERSION }}"
          name: "Build ${{ env.NEW_VERSION }}"
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.jar }}
            ${{ steps.package.outputs.fabric_jar }}
            ${{ steps.package.outputs.forge_jar }}
