name: Auto Bump, Build, and Release

on:
  push:
    branches:
      - main
    paths-ignore:
      # Ignore docs and configs so the bot's own commits don't trigger an infinite loop
      - "pom.xml"
      - "**/gradle.properties"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Force Bump Type (Ignored if Manual Version is set)"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      manual_version:
        description: "Manual Version (e.g., 4.1.0). Leave blank to use Bump Type/Commit logic."
        required: false
        type: string
      paper_type:
        description: "Paper release channel"
        required: false
        default: "release"
        type: choice
        options:
          - release
          - beta
          - alpha
      fabric_type:
        description: "Fabric release channel"
        required: false
        default: "alpha"
        type: choice
        options:
          - release
          - beta
          - alpha
      forge_type:
        description: "Forge release channel"
        required: false
        default: "alpha"
        type: choice
        options:
          - release
          - beta
          - alpha
      gh_prerelease:
        description: "Mark as pre-release on GitHub"
        required: false
        default: false
        type: boolean
      gh_latest:
        description: "Mark as latest release on GitHub"
        required: false
        default: true
        type: boolean

permissions:
  contents: write # Needed to push commits, tags, and releases

# Prevents multiple releases from running at once and hitting "push rejected" errors
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump-and-release:
    runs-on: ubuntu-latest
    # Prevents the bot from triggering itself in an infinite loop
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed to push tags and commits back to the repo

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # --- VERSION BUMPING LOGIC ---
      - name: Calculate Next Version
        id: version_math
        env:
          BUMP_TYPE_INPUT: ${{ inputs.bump_type }}
          MANUAL_VERSION_INPUT: ${{ inputs.manual_version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          OLD_VERSION="$(grep -o "version = '[^']*'" paper/build.gradle | cut -d"'" -f2)"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$OLD_VERSION"

          BUMP_TYPE="$BUMP_TYPE_INPUT"
          MANUAL_VERSION="$MANUAL_VERSION_INPUT"
          SKIP_RELEASE="false"

          if [[ "$EVENT_NAME" == "push" ]]; then
            COMMIT_MSG=$(git log -1 --pretty=%B)
            
            # 1. Check for skips first (docs, github actions, tests)
            if [[ "$COMMIT_MSG" == *"docs:"* ]] || [[ "$COMMIT_MSG" == *"ci:"* ]] || [[ "$COMMIT_MSG" == *"test:"* ]]; then
              echo "Housekeeping commit detected. Skipping release."
              SKIP_RELEASE="true"
            # 2. Check for Major
            elif [[ "$COMMIT_MSG" == *"BREAKING"* ]] || [[ "$COMMIT_MSG" == *"[major]"* ]]; then
              BUMP_TYPE="major"
            # 3. Check for Minor
            elif [[ "$COMMIT_MSG" == *"feat:"* ]] || [[ "$COMMIT_MSG" == *"[minor]"* ]]; then
              BUMP_TYPE="minor"
            # 4. Default to Patch
            else
              BUMP_TYPE="patch"
            fi
          fi

          echo "skip=$SKIP_RELEASE" >> $GITHUB_OUTPUT

          if [ "$SKIP_RELEASE" == "false" ]; then
            # Priority: Manual Version -> Major -> Minor -> Patch
            if [[ -n "$MANUAL_VERSION" ]]; then
              if ! [[ "$MANUAL_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][A-Za-z0-9.-]+)?$ ]]; then
                echo "Invalid manual_version input: '$MANUAL_VERSION'. Expected semantic version like 1.2.3 or 1.2.3-rc.1."
                exit 1
              fi
              NEW_VERSION="$MANUAL_VERSION"
            elif [ "$BUMP_TYPE" == "major" ]; then
              NEW_VERSION="$((MAJOR + 1)).0.0"
            elif [ "$BUMP_TYPE" == "minor" ]; then
              NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
            else
              NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            fi
            
            echo "OLD_VERSION=$OLD_VERSION" >> $GITHUB_ENV
            echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          fi

      - name: Sync branch and tags
        if: steps.version_math.outputs.skip != 'true'
        run: |
          git fetch --prune --tags origin
          git pull --rebase origin main

      # --- APPLY AND COMMIT ---
      - name: Apply Version to Gradle files
        if: steps.version_math.outputs.skip != 'true'
        run: |
          # Safely update the gradle properties
          sed -i "s/version = '$OLD_VERSION'/version = '$NEW_VERSION'/g" paper/build.gradle || true
          sed -i "s/$OLD_VERSION/$NEW_VERSION/g" fabric/gradle.properties || true
          sed -i "s/$OLD_VERSION/$NEW_VERSION/g" forge/gradle.properties || true

      - name: Auto-Update Docs References
        if: steps.version_math.outputs.skip != 'true'
        run: |
          # Safely scans ALL .md files anywhere in the repo and swaps the version text
          find . -type f -name "*.md" -print0 | xargs -0 sed -i "s/$OLD_VERSION/$NEW_VERSION/g"

      # --- BUILDING JARS ---
      - name: Build Minecraft Mods
        if: steps.version_math.outputs.skip != 'true'
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Commit version bump to Repository
        if: steps.version_math.outputs.skip != 'true'
        id: commit_version
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          TAG="v${NEW_VERSION}"
          TAG_CREATED="false"

          # Refresh tags before deciding whether this release version is new.
          git fetch --prune --tags origin

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists locally; skipping release commit and tag."
            echo "tag_created=false" >> "${GITHUB_OUTPUT}"
            exit 0
          elif git ls-remote --tags origin "${TAG}" | grep -q "refs/tags/${TAG}$"; then
            echo "Tag ${TAG} already exists on origin; skipping release commit and tag."
            echo "tag_created=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Stage only tracked files changed by the version/doc update.
          git add -u || true

          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(release): bump version to ${TAG} [skip ci]"
            git tag "${TAG}"
            TAG_CREATED="true"

            git push origin main
            git push origin "${TAG}"
          fi

          echo "tag_created=${TAG_CREATED}" >> "${GITHUB_OUTPUT}"

      # --- PACKAGING AND RELEASING ---
      - name: Locate and Rename Jars
        if: steps.version_math.outputs.skip != 'true' && steps.commit_version.outputs.tag_created == 'true'
        id: package
        run: |
          # 1. Find the raw files
          RAW_PAPER="$(ls paper/build/libs/*.jar | grep -v sources | head -n 1)"
          RAW_FABRIC="$(ls fabric/build/libs/*.jar | grep -v sources | head -n 1)"
          RAW_FORGE="$(ls forge/build/libs/*.jar | grep -v sources | head -n 1)"

          # 2. Define the clean names
          FINAL_PAPER="SSoggySouls-Paper-${NEW_VERSION}.jar"
          FINAL_FABRIC="SSoggySouls-Fabric-${NEW_VERSION}.jar"
          FINAL_FORGE="SSoggySouls-Forge-${NEW_VERSION}.jar"

          # 3. Rename them on the runner
          mv "$RAW_PAPER" "$FINAL_PAPER"
          mv "$RAW_FABRIC" "$FINAL_FABRIC"
          mv "$RAW_FORGE" "$FINAL_FORGE"

          # 4. Output the new paths for the Release step
          echo "jar=$FINAL_PAPER" >> "${GITHUB_OUTPUT}"
          echo "fabric_jar=$FINAL_FABRIC" >> "${GITHUB_OUTPUT}"
          echo "forge_jar=$FINAL_FORGE" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        if: steps.version_math.outputs.skip != 'true' && steps.commit_version.outputs.tag_created == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.NEW_VERSION }}"
          name: "Build ${{ env.NEW_VERSION }}"
          generate_release_notes: true
          prerelease: ${{ github.event.inputs.gh_prerelease == 'true' || false }}
          make_latest: ${{ github.event.inputs.gh_latest == 'false' && 'false' || 'true' }}
          files: |
            ${{ steps.package.outputs.jar }}
            ${{ steps.package.outputs.fabric_jar }}
            ${{ steps.package.outputs.forge_jar }}

      - name: Publish Paper to Modrinth
        if: steps.version_math.outputs.skip != 'true'
        uses: Kir-Antipov/mc-publish@995edadc13559a8b28d0b7e6571229f067ec7659
        with:
          modrinth-id: Pb03qu6T
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          name: "SSoggySouls v${{ env.NEW_VERSION }} (Paper/Spigot)"
          version: "${{ env.NEW_VERSION }}+paper"
          version-type: ${{ github.event.inputs.paper_type || 'release' }}
          changelog: ${{ github.event.head_commit.message }}
          loaders: |
            paper
            purpur
            spigot
            bukkit
          game-versions: |
            1.21.1
            1.21.2
            1.21.3
            1.21.4
            1.21.5
            1.21.6
            1.21.7
            1.21.8
            1.21.9
            1.21.10
            1.21.11
          files: ${{ steps.package.outputs.jar }}

      - name: Publish Fabric to Modrinth
        if: steps.version_math.outputs.skip != 'true'
        uses: Kir-Antipov/mc-publish@995edadc13559a8b28d0b7e6571229f067ec7659
        with:
          modrinth-id: Pb03qu6T
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          name: "SSoggySouls v${{ env.NEW_VERSION }} (Fabric/Quilt)"
          version: "${{ env.NEW_VERSION }}+fabric"
          version-type: ${{ github.event.inputs.fabric_type || 'alpha' }}
          changelog: ${{ github.event.head_commit.message }}
          loaders: |
            fabric
            quilt
          game-versions: |
            1.21.1
            1.21.2
            1.21.3
            1.21.4
            1.21.5
            1.21.6
            1.21.7
            1.21.8
            1.21.9
            1.21.10
            1.21.11
          files: ${{ steps.package.outputs.fabric_jar }}

      - name: Publish Forge to Modrinth
        if: steps.version_math.outputs.skip != 'true'
        uses: Kir-Antipov/mc-publish@995edadc13559a8b28d0b7e6571229f067ec7659
        with:
          modrinth-id: Pb03qu6T
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          name: "SSoggySouls v${{ env.NEW_VERSION }} (Forge)"
          version: "${{ env.NEW_VERSION }}+forge"
          version-type: ${{ github.event.inputs.forge_type || 'alpha' }}
          changelog: ${{ github.event.head_commit.message }}
          loaders: forge
          game-versions: |
            1.21.1
            1.21.2
            1.21.3
            1.21.4
            1.21.5
            1.21.6
            1.21.7
            1.21.8
            1.21.9
            1.21.10
            1.21.11
          files: ${{ steps.package.outputs.forge_jar }}
