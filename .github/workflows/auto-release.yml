name: Version Bump and Release

on:
  push:
    branches:
      - main
    paths-ignore:
      # Non-runtime changes should build through CI when needed, but never release.
      - ".github/**"
      - ".codex/**"
      - "docs/**"
      - "**/gradle.properties"
      - "**/*.md"
      - "**/*.txt"
      - "**/*.log"
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Force Bump Type (Ignored if Manual Version is set)"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      manual_version:
        description: "Manual Version (e.g., 4.1.0). Leave blank to use Bump Type/Commit logic."
        required: false
        type: string
      paper_type:
        description: "Paper release channel"
        required: false
        default: "release"
        type: choice
        options:
          - release
          - beta
          - alpha
      fabric_type:
        description: "Fabric release channel"
        required: false
        default: "release"
        type: choice
        options:
          - release
          - beta
          - alpha
      forge_type:
        description: "Forge release channel"
        required: false
        default: "release"
        type: choice
        options:
          - release
          - beta
          - alpha
      gh_prerelease:
        description: "Mark as pre-release on GitHub"
        required: false
        default: false
        type: boolean
      gh_latest:
        description: "Mark as latest release on GitHub"
        required: false
        default: true
        type: boolean
      neoforge_type:
        description: "NeoForge release channel"
        required: false
        default: "release"
        type: choice
        options:
          - release
          - beta
          - alpha

# Prevents multiple releases from running at once and hitting "push rejected" errors
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Prevents bot commits and explicit skips from triggering release work.
    if: github.event_name == 'workflow_dispatch' || (github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]'))
    outputs:
      old_version: ${{ steps.version_math.outputs.old_version }}
      new_version: ${{ steps.version_math.outputs.new_version }}
      skip: ${{ steps.version_math.outputs.skip }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Calculate Next Version
        id: version_math
        env:
          BUMP_TYPE_INPUT: ${{ inputs.bump_type }}
          MANUAL_VERSION_INPUT: ${{ inputs.manual_version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          OLD_VERSION="$(grep -o "version = '[^']*'" paper/build.gradle | cut -d"'" -f2)"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$OLD_VERSION"

          BUMP_TYPE="$BUMP_TYPE_INPUT"
          MANUAL_VERSION="$MANUAL_VERSION_INPUT"
          SKIP_RELEASE="false"
          NEW_VERSION=""

          if [[ "$EVENT_NAME" == "push" ]]; then
            COMMIT_MSG=$(git log -1 --pretty=%B)

            # Define regex in variables to avoid syntax issues across bash versions.
            SKIP_REGEX="^(docs|ci|test)(\([^)]+\))?:"
            MAJOR_REGEX="^[a-z]+(\([^)]+\))?!:"
            MINOR_REGEX="^feat(\([^)]+\))?:"
            if [[ "$COMMIT_MSG" =~ $SKIP_REGEX ]]; then
              echo "Housekeeping commit detected. Skipping release."
              SKIP_RELEASE="true"
            elif [[ "$COMMIT_MSG" =~ $MAJOR_REGEX ]] || [[ "$COMMIT_MSG" == *"BREAKING CHANGE"* ]] || [[ "$COMMIT_MSG" == *"BREAKING-CHANGE"* ]] || [[ "$COMMIT_MSG" == *"[major]"* ]]; then
              BUMP_TYPE="major"
            elif [[ "$COMMIT_MSG" =~ $MINOR_REGEX ]] || [[ "$COMMIT_MSG" == *"[minor]"* ]]; then
              BUMP_TYPE="minor"
            else
              BUMP_TYPE="patch"
            fi
          fi

          if [ "$SKIP_RELEASE" == "false" ]; then
            if [[ -n "$MANUAL_VERSION" ]]; then
              VERSION_REGEX="^[0-9]+\.[0-9]+\.[0-9]+([-.+][A-Za-z0-9.-]+)?$"
              if ! [[ "$MANUAL_VERSION" =~ $VERSION_REGEX ]]; then
                echo "Invalid manual_version input: '$MANUAL_VERSION'. Expected semantic version like 1.2.3 or 1.2.3-rc.1."
                exit 1
              fi
              NEW_VERSION="$MANUAL_VERSION"
            elif [ "$BUMP_TYPE" == "major" ]; then
              NEW_VERSION="$((MAJOR + 1)).0.0"
            elif [ "$BUMP_TYPE" == "minor" ]; then
              NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
            else
              NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            fi
          fi

          echo "old_version=$OLD_VERSION" >> "${GITHUB_OUTPUT}"
          echo "new_version=$NEW_VERSION" >> "${GITHUB_OUTPUT}"
          echo "skip=$SKIP_RELEASE" >> "${GITHUB_OUTPUT}"

  build:
    name: Build Jars
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: prepare-release
    if: needs.prepare-release.outputs.skip != 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Apply Version to Gradle files
        env:
          OLD_VERSION: ${{ needs.prepare-release.outputs.old_version }}
          NEW_VERSION: ${{ needs.prepare-release.outputs.new_version }}
        run: |
          sed -i "s/^version = .*/version = '$NEW_VERSION'/g" paper/build.gradle || true
          sed -i "s/^mod_version=.*/mod_version=$NEW_VERSION-fabric/g" fabric/gradle.properties || true
          sed -i "s/^mod_version=.*/mod_version=$NEW_VERSION-forge/g" forge/gradle.properties || true
          sed -i "s/^mod_version=.*/mod_version=$NEW_VERSION-neoforge/g" neoforge/gradle.properties || true

      - name: Build Minecraft Mods
        run: |
          chmod +x ./gradlew
          # Build platforms in total isolation using -DonlyPlatform to avoid plugin conflicts
          ./gradlew :common:build -DonlyPlatform=common --no-daemon
          ./gradlew :fabric:build -DonlyPlatform=fabric --no-daemon
          ./gradlew :paper:build -DonlyPlatform=paper --no-daemon
          ./gradlew :neoforge:build -DonlyPlatform=neoforge --no-daemon
          ./gradlew :forge:build -DonlyPlatform=forge --no-daemon

      - name: Locate and Rename Jars
        env:
          NEW_VERSION: ${{ needs.prepare-release.outputs.new_version }}
        run: |
          echo "DEBUG: All jars produced by build:"
          ls -lh paper/build/libs/ fabric/build/libs/ forge/build/libs/ neoforge/build/libs/ || true

          # Paper: standard shadow jar — exclude sources, pick the largest remaining
          RAW_PAPER="$(find paper/build/libs -maxdepth 1 -name '*.jar' \
            ! -name '*sources*' ! -name '*dev*' ! -name '*slim*' \
            ! -name '*all*' ! -name '*original*' ! -name '*shadow*' \
            -printf '%s %p\n' | sort -rn | head -n 1 | awk '{print $2}')"

          # Fabric Loom: remapJar output has NO -dev suffix; the pre-remap dev jar
          # gets a -dev suffix added by Loom. Explicitly exclude -dev and -sources.
          RAW_FABRIC="$(find fabric/build/libs -maxdepth 1 -name '*.jar' \
            ! -name '*-dev.jar' ! -name '*sources*' \
            -printf '%s %p\n' | sort -rn | head -n 1 | awk '{print $2}')"

          # Forge: single jar produced by the jar task (no reobf since reobf=false)
          RAW_FORGE="$(find forge/build/libs -maxdepth 1 -name '*.jar' \
            ! -name '*sources*' ! -name '*dev*' ! -name '*slim*' \
            ! -name '*all*' ! -name '*original*' ! -name '*shadow*' \
            -printf '%s %p\n' | sort -rn | head -n 1 | awk '{print $2}')"

          # NeoForge: jarJar produces a single fat jar; the plain jar is also emitted
          # — pick the largest to get the jarJar (fat) artifact.
          RAW_NEOFORGE="$(find neoforge/build/libs -maxdepth 1 -name '*.jar' \
            ! -name '*sources*' ! -name '*dev*' ! -name '*slim*' \
            ! -name '*all*' ! -name '*original*' ! -name '*shadow*' \
            -printf '%s %p\n' | sort -rn | head -n 1 | awk '{print $2}')"

          echo "Selected: Paper=$RAW_PAPER, Fabric=$RAW_FABRIC, Forge=$RAW_FORGE, NeoForge=$RAW_NEOFORGE"

          if [ -z "$RAW_PAPER" ] || [ -z "$RAW_FABRIC" ] || [ -z "$RAW_FORGE" ] || [ -z "$RAW_NEOFORGE" ]; then
            echo "Error: One or more jars not found! Check the DEBUG listing above."
            exit 1
          fi

          mv "$RAW_PAPER" "SSoggySouls-Paper-${NEW_VERSION}.jar"
          mv "$RAW_FABRIC" "SSoggySouls-Fabric-${NEW_VERSION}.jar"
          mv "$RAW_FORGE" "SSoggySouls-Forge-${NEW_VERSION}.jar"
          mv "$RAW_NEOFORGE" "SSoggySouls-NeoForge-${NEW_VERSION}.jar"

      - name: Upload Paper Jar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paper-jar
          path: SSoggySouls-Paper-${{ needs.prepare-release.outputs.new_version }}.jar

      - name: Upload Fabric Jar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fabric-jar
          path: SSoggySouls-Fabric-${{ needs.prepare-release.outputs.new_version }}.jar

      - name: Upload Forge Jar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: forge-jar
          path: SSoggySouls-Forge-${{ needs.prepare-release.outputs.new_version }}.jar

      - name: Upload NeoForge Jar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: neoforge-jar
          path: SSoggySouls-NeoForge-${{ needs.prepare-release.outputs.new_version }}.jar

  commit-version:
    name: Commit Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - prepare-release
      - build
    if: needs.prepare-release.outputs.skip != 'true'
    outputs:
      tag_created: ${{ steps.commit_version.outputs.tag_created }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Apply Version to Gradle files
        env:
          OLD_VERSION: ${{ needs.prepare-release.outputs.old_version }}
          NEW_VERSION: ${{ needs.prepare-release.outputs.new_version }}
        run: |
          sed -i "s/^version = .*/version = '$NEW_VERSION'/g" paper/build.gradle || true
          sed -i "s/^mod_version=.*/mod_version=$NEW_VERSION-fabric/g" fabric/gradle.properties || true
          sed -i "s/^mod_version=.*/mod_version=$NEW_VERSION-forge/g" forge/gradle.properties || true
          sed -i "s/^mod_version=.*/mod_version=$NEW_VERSION-neoforge/g" neoforge/gradle.properties || true

      - name: Auto-Update Docs References
        env:
          OLD_VERSION: ${{ needs.prepare-release.outputs.old_version }}
          NEW_VERSION: ${{ needs.prepare-release.outputs.new_version }}
        run: |
          find . -type f -name "*.md" -print0 | xargs -0 sed -i "s/$OLD_VERSION/$NEW_VERSION/g"

      - name: Commit version bump to Repository
        id: commit_version
        env:
          NEW_VERSION: ${{ needs.prepare-release.outputs.new_version }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          TAG="v${NEW_VERSION}"
          TAG_CREATED="false"

          git add -u || true

          if ! git diff-index --quiet HEAD; then
            git commit \
              -m "chore(common): bump mod version to ${TAG}" \
              -m "- Update platform version files to ${TAG}." \
              -m "- Refresh documentation references for ${TAG}."

            git fetch --prune --tags origin

            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              echo "Tag ${TAG} already exists locally; skipping release tag and push."
              echo "tag_created=false" >> "${GITHUB_OUTPUT}"
              exit 0
            elif git ls-remote --tags origin "${TAG}" | grep -q "refs/tags/${TAG}$"; then
              echo "Tag ${TAG} already exists on origin; skipping release tag and push."
              echo "tag_created=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            git pull --rebase origin main

            git tag "${TAG}"
            TAG_CREATED="true"

            git push origin main
            git push origin "${TAG}"
          fi

          echo "tag_created=${TAG_CREATED}" >> "${GITHUB_OUTPUT}"

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - prepare-release
      - build
      - commit-version
    # Removed restrictive 'if' to allow manual re-runs and retries.
    # The action itself will handle existing releases gracefully.

    steps:
      - name: Download Paper Jar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: paper-jar

      - name: Download Fabric Jar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fabric-jar

      - name: Download Forge Jar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: forge-jar

      - name: Download NeoForge Jar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: neoforge-jar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        continue-on-error: true # Don't block publications if release already exists
        with:
          tag_name: "v${{ needs.prepare-release.outputs.new_version }}"
          name: "Build ${{ needs.prepare-release.outputs.new_version }}"
          generate_release_notes: true
          prerelease: ${{ github.event.inputs.gh_prerelease == 'true' || false }}
          make_latest: ${{ github.event.inputs.gh_latest == 'false' && 'false' || 'true' }}
          files: |
            SSoggySouls-Paper-${{ needs.prepare-release.outputs.new_version }}.jar
            SSoggySouls-Fabric-${{ needs.prepare-release.outputs.new_version }}.jar
            SSoggySouls-Forge-${{ needs.prepare-release.outputs.new_version }}.jar
            SSoggySouls-NeoForge-${{ needs.prepare-release.outputs.new_version }}.jar

  publish-paper:
    name: Publish Paper
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - prepare-release
      - commit-version
      - github-release
    # No job-level 'if' here, each step handles its own skipping logic to allow for retries.

    steps:
      - name: Download Paper Jar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: paper-jar

      - name: Check if Paper version already exists on Modrinth
        id: check_paper
        env:
          NEW_VERSION: ${{ needs.prepare-release.outputs.new_version }}
        run: |
          # Correct endpoint: /v2/project/{id}/version
          # We check if the version number is in the response.
          echo "Checking if version ${NEW_VERSION}+paper exists for project Pb03qu6T..."
          RESPONSE=$(curl -s "https://api.modrinth.com/v2/project/Pb03qu6T/version")
          if echo "$RESPONSE" | grep -Fq "\"version_number\":\"${NEW_VERSION}+paper\""; then
            echo "Version ${NEW_VERSION}+paper already exists on Modrinth. Skipping upload."
            echo "already_published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Version ${NEW_VERSION}+paper not found on Modrinth."
            echo "already_published=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish Paper to Modrinth
        if: steps.check_paper.outputs.already_published != 'true'
        uses: Kir-Antipov/mc-publish@995edadc13559a8b28d0b7e6571229f067ec7659
        with:
          modrinth-id: Pb03qu6T
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          name: "SSoggySouls v${{ needs.prepare-release.outputs.new_version }} (Paper/Spigot)"
          version: "${{ needs.prepare-release.outputs.new_version }}+paper"
          version-type: ${{ github.event.inputs.paper_type || 'release' }}
          changelog: ${{ github.event.head_commit.message || format('Manual release {0}', needs.prepare-release.outputs.new_version) }}
          loaders: |
            paper
            purpur
            spigot
            bukkit
          game-versions: |
            1.21.1
            1.21.2
            1.21.3
            1.21.4
            1.21.5
            1.21.6
            1.21.7
            1.21.8
            1.21.9
            1.21.10
            1.21.11
          modrinth-files: SSoggySouls-Paper-${{ needs.prepare-release.outputs.new_version }}.jar

  publish-fabric:
    name: Publish Fabric
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - prepare-release
      - commit-version
      - github-release
    # No job-level 'if' here, each step handles its own skipping logic to allow for retries.

    steps:
      - name: Download Fabric Jar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fabric-jar

      - name: Check if Fabric version already exists on Modrinth
        id: check_fabric
        env:
          NEW_VERSION: ${{ needs.prepare-release.outputs.new_version }}
        run: |
          # Correct endpoint: /v2/project/{id}/version
          # We check if the version number is in the response.
          echo "Checking if version ${NEW_VERSION}+fabric exists for project Pb03qu6T..."
          RESPONSE=$(curl -s "https://api.modrinth.com/v2/project/Pb03qu6T/version")
          if echo "$RESPONSE" | grep -Fq "\"version_number\":\"${NEW_VERSION}+fabric\""; then
            echo "Version ${NEW_VERSION}+fabric already exists on Modrinth. Skipping upload."
            echo "already_published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Version ${NEW_VERSION}+fabric not found on Modrinth."
            echo "already_published=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish Fabric to Modrinth
        if: steps.check_fabric.outputs.already_published != 'true'
        uses: Kir-Antipov/mc-publish@995edadc13559a8b28d0b7e6571229f067ec7659
        with:
          modrinth-id: Pb03qu6T
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          name: "SSoggySouls v${{ needs.prepare-release.outputs.new_version }} (Fabric/Quilt)"
          version: "${{ needs.prepare-release.outputs.new_version }}+fabric"
          version-type: ${{ github.event.inputs.fabric_type || 'release' }}
          changelog: ${{ github.event.head_commit.message || format('Manual release {0}', needs.prepare-release.outputs.new_version) }}
          loaders: |
            fabric
            quilt
          game-versions: |
            1.21.1
            1.21.2
            1.21.3
            1.21.4
            1.21.5
            1.21.6
            1.21.7
            1.21.8
            1.21.9
            1.21.10
            1.21.11
          modrinth-files: SSoggySouls-Fabric-${{ needs.prepare-release.outputs.new_version }}.jar

  publish-forge:
    name: Publish Forge
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - prepare-release
      - commit-version
      - github-release
    # No job-level 'if' here, each step handles its own skipping logic to allow for retries.

    steps:
      - name: Download Forge Jar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: forge-jar

      - name: Check if Forge version already exists on Modrinth
        id: check_forge
        env:
          NEW_VERSION: ${{ needs.prepare-release.outputs.new_version }}
        run: |
          # Correct endpoint: /v2/project/{id}/version
          # We check if the version number is in the response.
          echo "Checking if version ${NEW_VERSION}+forge exists for project Pb03qu6T..."
          RESPONSE=$(curl -s "https://api.modrinth.com/v2/project/Pb03qu6T/version")
          if echo "$RESPONSE" | grep -Fq "\"version_number\":\"${NEW_VERSION}+forge\""; then
            echo "Version ${NEW_VERSION}+forge already exists on Modrinth. Skipping upload."
            echo "already_published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Version ${NEW_VERSION}+forge not found on Modrinth."
            echo "already_published=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish Forge to Modrinth
        if: steps.check_forge.outputs.already_published != 'true'
        uses: Kir-Antipov/mc-publish@995edadc13559a8b28d0b7e6571229f067ec7659
        with:
          modrinth-id: Pb03qu6T
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          name: "SSoggySouls v${{ needs.prepare-release.outputs.new_version }} (Forge)"
          version: "${{ needs.prepare-release.outputs.new_version }}+forge"
          version-type: ${{ github.event.inputs.forge_type || 'release' }}
          changelog: ${{ github.event.head_commit.message || format('Manual release {0}', needs.prepare-release.outputs.new_version) }}
          loaders: forge
          game-versions: |
            1.21.1
            1.21.2
            1.21.3
            1.21.4
            1.21.5
            1.21.6
            1.21.7
            1.21.8
            1.21.9
            1.21.10
            1.21.11
          modrinth-files: SSoggySouls-Forge-${{ needs.prepare-release.outputs.new_version }}.jar

  publish-neoforge:
    name: Publish NeoForge
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - prepare-release
      - commit-version
      - github-release
    # No job-level 'if' here, each step handles its own skipping logic to allow for retries.

    steps:
      - name: Download NeoForge Jar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: neoforge-jar

      - name: Check if NeoForge version already exists on Modrinth
        id: check_neoforge
        env:
          NEW_VERSION: ${{ needs.prepare-release.outputs.new_version }}
        run: |
          # Correct endpoint: /v2/project/{id}/version
          # We check if the version number is in the response.
          echo "Checking if version ${NEW_VERSION}+neoforge exists for project Pb03qu6T..."
          RESPONSE=$(curl -s "https://api.modrinth.com/v2/project/Pb03qu6T/version")
          if echo "$RESPONSE" | grep -Fq "\"version_number\":\"${NEW_VERSION}+neoforge\""; then
            echo "Version ${NEW_VERSION}+neoforge already exists on Modrinth. Skipping upload."
            echo "already_published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Version ${NEW_VERSION}+neoforge not found on Modrinth."
            echo "already_published=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish NeoForge to Modrinth
        if: steps.check_neoforge.outputs.already_published != 'true'
        uses: Kir-Antipov/mc-publish@995edadc13559a8b28d0b7e6571229f067ec7659
        with:
          modrinth-id: Pb03qu6T
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          name: "SSoggySouls v${{ needs.prepare-release.outputs.new_version }} (NeoForge)"
          version: "${{ needs.prepare-release.outputs.new_version }}+neoforge"
          version-type: ${{ github.event.inputs.neoforge_type || 'release' }}
