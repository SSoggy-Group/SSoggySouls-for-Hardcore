name: Build Plugin/Mod Jars And Tag Release

'on':
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional tag name for manual runs (example: v2.1.2). Defaults to pom version tag."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven


      - name: Build with Maven (Root)
        run: mvn -B clean package

      - name: Build Fabric Mod
        run: |
          chmod +x ./fabric/gradlew
          ./fabric/gradlew -p fabric build

      - name: Build Forge Mod
        run: |
          chmod +x ./forge/gradlew
          ./forge/gradlew -p forge build

      - name: Select jars for release
        id: package
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          EXPECTED_TAG="v${VERSION}"

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            if [[ "${TAG_NAME}" != "${EXPECTED_TAG}" ]]; then
              echo "Tag '${TAG_NAME}' does not match pom version '${EXPECTED_TAG}'."
              echo "Use a matching tag (example: ${EXPECTED_TAG})."
              exit 1
            fi
          else
            TAG_NAME="${{ inputs.release_tag }}"
            if [[ -z "${TAG_NAME}" ]]; then
              TAG_NAME="${EXPECTED_TAG}"
            fi
          fi

          # Always publish the shaded plugin artifact so runtime deps are bundled.
          JAR_PATH="$(ls target/*-shaded.jar 2>/dev/null | head -n 1 || true)"
          if [[ -z "${JAR_PATH}" ]]; then
            echo "No shaded plugin jar found in target/ (expected *-shaded.jar)."
            exit 1
          fi

          JAR_NAME="$(basename "${JAR_PATH}")"

          # Find fabric jar (ignoring source jars)
          FABRIC_JAR_PATH="$(ls fabric/build/libs/*.jar 2>/dev/null | grep -v sources | head -n 1 || true)"
          if [[ -z "${FABRIC_JAR_PATH}" ]]; then
            echo "No fabric jar found in fabric/build/libs/."
            exit 1
          fi

          # Find forge jar (ignoring source jars)
          FORGE_JAR_PATH="$(ls forge/build/libs/*.jar 2>/dev/null | grep -v sources | head -n 1 || true)"
          if [[ -z "${FORGE_JAR_PATH}" ]]; then
            echo "No forge jar found in forge/build/libs/."
            exit 1
          fi

          # Set outputs for next steps
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG_NAME}" >> "${GITHUB_OUTPUT}"
          
          echo "jar=${JAR_PATH}" >> "${GITHUB_OUTPUT}"
          echo "jar_name=${JAR_NAME}" >> "${GITHUB_OUTPUT}"
          
          echo "fabric_jar=${FABRIC_JAR_PATH}" >> "${GITHUB_OUTPUT}"
          echo "forge_jar=${FORGE_JAR_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Upload plugin build artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: ${{ steps.package.outputs.jar }}

      - name: Upload fabric build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fabric-jar
          path: ${{ steps.package.outputs.fabric_jar }}

      - name: Upload forge build artifact
        uses: actions/upload-artifact@v4
        with:
          name: forge-jar
          path: ${{ steps.package.outputs.forge_jar }}

      - name: Create tag release with jars
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          name: Build ${{ steps.package.outputs.version }} (${{ steps.package.outputs.tag }})
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.jar }}
            ${{ steps.package.outputs.fabric_jar }}
            ${{ steps.package.outputs.forge_jar }}
