name: CI Tests

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - ".codex/**"
      - ".jules/**"
      - "docs/**"
      - "**/*.md"
      - "**/*.txt"
      - "**/*.log"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - ".codex/**"
      - ".jules/**"
      - "docs/**"
      - "**/*.md"
      - "**/*.txt"
      - "**/*.log"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0  # Full history for accurate SonarQube blame analysis

      - name: Set up JDK 21
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Build and Test
        run: |
          chmod +x ./gradlew
          # Build platforms in total isolation using -DonlyPlatform to avoid plugin conflicts
          ./gradlew :common:build -DonlyPlatform=common --no-daemon
          ./gradlew :fabric:build -DonlyPlatform=fabric --no-daemon
          ./gradlew :paper:build -DonlyPlatform=paper --no-daemon
          ./gradlew :neoforge:build -DonlyPlatform=neoforge --no-daemon
          ./gradlew :forge:build -DonlyPlatform=forge --no-daemon

  sonar:
    name: SonarQube Analysis
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Cache SonarQube packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          chmod +x ./gradlew
          ./gradlew classes sonar

  dependency-submission:
    name: Submit Dependency Graph
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Only submit dependency graphs on pushes to main to prevent PR overhead and fork failures
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Generate and Submit Dependency Graph
        uses: gradle/actions/dependency-submission@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
