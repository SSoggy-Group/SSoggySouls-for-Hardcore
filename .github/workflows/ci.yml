name: CI Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Maven Tests
        run: mvn -B test

      - name: Make Gradle Wrapper Executable
        if: always()
        run: chmod +x ./fabric/gradlew

      - name: Run Fabric Tests
        if: always()
        run: |
          cd fabric
          ./gradlew test
