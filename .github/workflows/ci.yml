name: CI Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Root Bukkit/Spigot/Paper Plugin (Maven)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Root Plugin Tests
        run: mvn -B test

      # 2. Setup Gradle globally (handles caching for BOTH Fabric and Forge)
      - name: Setup Gradle
        if: always()
        uses: gradle/actions/setup-gradle@v4

      # 3. Fabric Mod (Gradle)
      - name: Run Fabric Tests
        if: always()
        run: |
          chmod +x ./fabric/gradlew
          ./fabric/gradlew -p fabric test

      # 4. Forge Mod (Gradle)
      - name: Run Forge Tests
        if: always()
        run: |
          chmod +x ./forge/gradlew
          ./forge/gradlew -p forge test
