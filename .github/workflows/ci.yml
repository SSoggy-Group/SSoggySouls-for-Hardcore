name: CI Tests

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - ".codex/**"
      - ".jules/**"
      - "docs/**"
      - "**/*.md"
      - "**/*.txt"
      - "**/*.log"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - ".codex/**"
      - ".jules/**"
      - "docs/**"
      - "**/*.md"
      - "**/*.txt"
      - "**/*.log"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build and Test
        run: |
          chmod +x ./gradlew
          # Build platforms in total isolation using -DonlyPlatform to avoid plugin conflicts
          ./gradlew :common:build -DonlyPlatform=common --no-daemon
          ./gradlew :fabric:build -DonlyPlatform=fabric --no-daemon
          ./gradlew :paper:build -DonlyPlatform=paper --no-daemon
          ./gradlew :neoforge:build -DonlyPlatform=neoforge --no-daemon
          ./gradlew :forge:build -DonlyPlatform=forge --no-daemon

