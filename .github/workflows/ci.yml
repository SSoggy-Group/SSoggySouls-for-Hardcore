name: CI Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Maven Tests
        run: mvn -B test

      - name: Run Fabric Tests
        run: |
          cd fabric
          ./gradlew test
