name: CI Tests

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - ".codex/**"
      - ".jules/**"
      - "docs/**"
      - "**/*.md"
      - "**/*.txt"
      - "**/*.log"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - ".codex/**"
      - ".jules/**"
      - "docs/**"
      - "**/*.md"
      - "**/*.txt"
      - "**/*.log"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Build and Test
        run: |
          chmod +x ./gradlew
          # Build platforms in total isolation using -DonlyPlatform to avoid plugin conflicts
          ./gradlew :common:build -DonlyPlatform=common --no-daemon
          ./gradlew :fabric:build -DonlyPlatform=fabric --no-daemon
          ./gradlew :paper:build -DonlyPlatform=paper --no-daemon
          ./gradlew :neoforge:build -DonlyPlatform=neoforge --no-daemon
          ./gradlew :forge:build -DonlyPlatform=forge --no-daemon

