name: "CodeQL Advanced"

on:
  push:
    branches: ["main"]
    paths-ignore:
      - ".codex/**"
      - ".jules/**"
      - "docs/**"
      - "**/*.md"
      - "**/*.txt"
      - "**/*.log"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - ".codex/**"
      - ".jules/**"
      - "docs/**"
      - "**/*.md"
      - "**/*.txt"
      - "**/*.log"
  schedule:
    - cron: "30 0 * * 1"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Initialize CodeQL
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: java-kotlin
          # Run CodeQL in manual mode so we compile with Gradle.
          # This resolves dependencies correctly for full analysis precision.
          build-mode: manual
          # This points to our custom config to only scan our source directories.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build with Gradle Wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew build -x test

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:java-kotlin"
