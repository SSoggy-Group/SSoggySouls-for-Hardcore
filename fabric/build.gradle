plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

dependencies {
    // Inject the common module via JiJ (now has version = '1.0.0', fixing
    // the 'unspecified is not valid semver' error that caused remapJar to
    // produce an empty 308-byte JAR).
    implementation project(':common')
    include project(':common')

    // Minecraft + Fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API modules
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation include("me.lucko:fabric-permissions-api:0.7.0")

    // Database dependencies bundled via Jar-in-Jar so Fabric Loader
    // unpacks them at runtime — plug-and-play, no manual installation needed.
    include implementation("com.zaxxer:HikariCP:7.0.2")
    include implementation("com.mysql:mysql-connector-j:8.0.33")
    include group: 'org.xerial', name: 'sqlite-jdbc', version: '3.45.3.0'
    implementation group: 'org.xerial', name: 'sqlite-jdbc', version: '3.45.3.0'

    // Mod Menu API (compile only, provided by Mod Menu mod at runtime)
    compileOnly "com.terraformersmc:modmenu:21.0.0-beta.1"

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.14.4'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.14.4'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.14.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.23.0'
}

test {
    useJUnitPlatform()
    // Native desktop libraries for MC client tests cannot be fetched through SSL MITM proxy
    onlyIf { !project.hasProperty('skipFabricTest') }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

jar {
    from("../LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
