plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

dependencies {
    // Inject the common module
    implementation project(':common')

    // Minecraft + Fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API modules
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // HikariCP for database connection pooling (nested into mod JAR via JiJ)
    include implementation("com.zaxxer:HikariCP:7.0.2")

    // MySQL Connector (nested into mod JAR via JiJ)
    include implementation("com.mysql:mysql-connector-j:9.7.0")

    // SQLite JDBC (nested into mod JAR via JiJ)
    include implementation("org.xerial:sqlite-jdbc:3.53.1.0")

    // Mod Menu API (compile only, provided by Mod Menu mod at runtime)
    modCompileOnlyApi "com.terraformersmc:modmenu:17.0.0"

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.0.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.0.3'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:6.0.3'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.23.0'
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

jar {
    from("../LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
