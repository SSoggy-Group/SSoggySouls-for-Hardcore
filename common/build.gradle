group = 'org.ssoggy'
version = '1.0.0'

dependencies {
    // Database connection pooling
    // Changed to compileOnly so they don't leak into Forge/NeoForge's
    // compileClasspath and cause fastcsv version conflicts.
    compileOnly 'com.zaxxer:HikariCP:7.0.2'

    // JetBrains Annotations for nullability checks
    compileOnly 'org.jetbrains:annotations:26.1.0'

    // MySQL Connector
    compileOnly 'com.mysql:mysql-connector-j:8.0.33'

    // SQLite JDBC
    compileOnly 'org.xerial:sqlite-jdbc:3.45.3'

    // SLF4J API (provided by the server environments)
    compileOnly 'org.slf4j:slf4j-api:2.0.17'

    // Testing - needs these for real
    testImplementation 'com.zaxxer:HikariCP:7.0.2'
    testImplementation 'com.mysql:mysql-connector-j:9.7.0'
    testImplementation 'org.xerial:sqlite-jdbc:3.45.3'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.14.4'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.14.4'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.14.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.23.0'
}

test {
    useJUnitPlatform()
}
