# SonarCloud Analysis Configuration
# CI-based analysis — Automatic Analysis has been disabled in SonarCloud UI.
# Analysis is triggered via ./gradlew build sonar in .github/workflows/ci.yml.

sonar.host.url=https://sonarcloud.io

# Exclude platform-specific loaders from Copy-Paste Detection (CPD / Duplications)
# Fabric, Forge, and NeoForge wrapper/bootstrap files naturally mirror each other's structures.
sonar.cpd.exclusions=fabric/**/*,forge/**/*,neoforge/**/*
